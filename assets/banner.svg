<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes beamMove{0%{stroke-dashoffset:600}}.badge-label,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-label{font-weight:600;font-size:13px;fill:#e2e8f0}.pulse-sphere-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.pulse-sphere-2{animation:pulseGlow 8s ease-in-out infinite reverse;transform-origin:1000px 260px}.card-float-1{animation:floatCard1 4s ease-in-out infinite}.card-float-2{animation:floatCard2 5s ease-in-out infinite}.data-stream{stroke-dasharray:20,10;animation:beamMove 12s linear infinite}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><re